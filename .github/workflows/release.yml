name: Build and Release fpk

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -L -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack

      - name: Build fpk
        run: ./fnpack build

      - name: Get version from manifest
        id: ver
        run: |
          VERSION=$(grep '^version' manifest | awk -F'=' '{gsub(/[ \t]/,"",$2); print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: overtime-tracker.fpk
          name: "记加班 v${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: overtime-tracker-fpk
          path: overtime-tracker.fpk
