<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记加班</title>
<script>try{var t=localStorage.getItem('jb-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* ============================================================
   记加班 — 对标参考设计：美观整洁、不易视觉疲劳
   ============================================================ */

/* ---- CSS 变量（柔和护眼） ---- */
:root {
  --bg: #f5f7fa; --surface: #ffffff; --text: #1a1a2e;
  --text-sec: #6b7280; --text-light: #9ca3af;
  --border: #e8ecf1; --border-light: #f0f2f5;
  --hdr-from: #667eea; --hdr-to: #764ba2;
  --accent: #5b7fff; --accent-hover: #4a6cf7;
  --success: #34d399; --danger: #ef4444; --warning: #f59e0b;
  /* 日历色 — 对标参考截图 */
  --cal-ho-bg: #fef3c7; --cal-ho-border: #f59e0b; --cal-ho-text: #b45309;
  --cal-wd-bg: #fffbeb; --cal-wd-border: #fbbf24;
  --cal-we-bg: #ecfdf5; --cal-we-border: #a7f3d0;
  --cal-ot-bg: #eff6ff; --cal-ot-border: #93c5fd; --cal-ot-text: #2563eb;
  --cal-today-ring: #f87171;
  /* 统计卡片色 — 对标参考截图 */
  --stat-teal: #14b8a6; --stat-blue: #3b82f6; --stat-amber: #f59e0b;
  --stat-grad-from: #7c3aed; --stat-grad-to: #a78bfa;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
  --r-card: 14px; --r-input: 10px; --r-btn: 10px; --r-cell: 10px;
  --page-pad: 16px; --card-gap: 12px;
}
[data-theme="dark"] {
  --bg: #111318; --surface: #1c1f2a; --text: #e8eaed;
  --text-sec: #9aa0b0; --text-light: #555c6a;
  --border: #282c38; --border-light: #1f232e;
  --hdr-from: #4a5bd1; --hdr-to: #6b3fa0;
  --accent: #7c93ff; --accent-hover: #6980fc;
  --success: #4ade80; --danger: #fb7185; --warning: #fbbf24;
  --cal-ho-bg: #2d1f14; --cal-ho-border: #d97706; --cal-ho-text: #fbbf24;
  --cal-wd-bg: #2a2510; --cal-wd-border: #d97706;
  --cal-we-bg: #0d2818; --cal-we-border: #059669;
  --cal-ot-bg: #172554; --cal-ot-border: #3b82f6; --cal-ot-text: #93c5fd;
  --cal-today-ring: #ef4444;
  --stat-teal: #2dd4bf; --stat-blue: #60a5fa; --stat-amber: #fbbf24;
  --stat-grad-from: #6d28d9; --stat-grad-to: #8b5cf6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.20);
  --shadow-md: 0 4px 16px rgba(0,0,0,.30);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.40);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14.5px;line-height:1.6;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .3s,color .3s
}

/* ---- App Shell ---- */
.app-shell{display:flex;flex-direction:column;min-height:100vh;width:100%;background:var(--bg)}

/* ---- 简洁头部 ---- */
.app-header{
  background:linear-gradient(135deg,var(--hdr-from),var(--hdr-to));
  padding:28px var(--page-pad) 18px;position:relative;overflow:hidden
}
.app-header::before{content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.app-header::after{content:'';position:absolute;bottom:-30%;left:-10%;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04)}
.header-inner{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;max-width:1200px;margin:0 auto;width:100%}
.header-brand{display:flex;align-items:center;gap:8px}
.header-icon{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;flex-shrink:0
}
.header-text h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px;line-height:1.2}
.header-sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.hdr-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .15s;flex-shrink:0
}
.hdr-btn:hover{background:rgba(255,255,255,.22)}
.hdr-btn:active{transform:scale(.92)}

/* ---- 主内容区 ---- */
.app-body{
  flex:1;padding:0 var(--page-pad);margin-top:-12px;position:relative;z-index:2;
  max-width:1200px;margin-left:auto;margin-right:auto;width:100%
}
.layout-desktop{
  display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;padding-top:16px
}
.layout-left{display:flex;flex-direction:column;gap:var(--card-gap);min-width:0}
.layout-right{display:flex;flex-direction:column;gap:var(--card-gap);min-width:0}
@media(max-width:959px){
  .layout-desktop{display:block}
  .layout-right{margin-top:var(--card-gap)}
}

/* ---- 页面标题行 ---- */
.page-title-row{display:flex;align-items:center;gap:8px;padding:12px 2px 8px}
.page-emoji{font-size:18px}
.page-title{font-size:17px;font-weight:700;color:var(--text)}

/* ---- 卡片通用 ---- */
.card{
  background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);padding:15px;
  border:1px solid var(--border-light);transition:background .25s,border-color .25s
}
.hidden{display:none!important}

/* ==================== 日历卡片 ==================== */
.cal-card{padding:16px 14px}
.cal-nav-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
.cal-arrow{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-sec);cursor:pointer;
  display:grid;place-items:center;transition:all .18s;flex-shrink:0
}
.cal-arrow:hover{border-color:var(--accent);color:var(--accent);background:rgba(91,127,255,.05)}
.cal-arrow:active{transform:scale(.9)}
.cal-month{font-size:16px;font-weight:650;color:var(--text);min-width:100px;text-align:center}

/* 图例 */
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;padding:0 2px}
.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sec)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}
.dot-ho{background:var(--cal-ho-bg);border:1.5px solid var(--cal-ho-border)}
.dot-wd{background:var(--cal-wd-bg);border:1.5px solid var(--cal-wd-border)}
.dot-we{background:var(--cal-we-bg);border:1.5px solid var(--cal-we-border)}
.dot-ot{background:var(--cal-ot-bg);border:1.5px solid var(--cal-ot-border)}

/* 星期头 */
.cal-week-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;padding:0 2px}
.cal-week-hdr span{text-align:center;font-size:12px;font-weight:600;color:var(--text-light);padding:5px 0}

/* 日历网格 —— 固定高度，不用 aspect-ratio */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
  position:relative;height:58px;min-height:58px;border-radius:var(--r-cell);
  background:var(--surface);border:1.5px solid transparent;
  padding:4px 3px 3px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .15s,box-shadow .18s,border-color .15s
}
.cal-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);z-index:2;border-color:var(--accent)}
.cal-cell:active{transform:scale(.96)}

/* 日期数字 —— 必须可见 */
.cal-num{font-size:13.5px;font-weight:650;line-height:1.2;color:var(--text);display:block}
/* 节假日名 */
.cal-hname{font-size:9px;color:var(--cal-ho-text);line-height:1.2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* 加班角标 — 对标参考（蓝色圆角标签） */
.cal-ot-badge{
  align-self:flex-start;font-size:9px;font-weight:700;color:#fff;
  background:var(--cal-ot-border);padding:1px 5px;border-radius:6px;
  line-height:1.4;margin-top:auto;min-height:0;display:inline-block
}

/* 单元格状态色 */
.cal-cell.cal-ho{background:var(--cal-ho-bg);border-color:var(--cal-ho-border)}
.cal-cell.cal-wd{background:var(--cal-wd-bg);border-color:var(--cal-wd-border)}
.cal-cell.cal-we{background:var(--cal-we-bg);border-color:var(--cal-we-border)}
.cal-cell.cal-ot{background:var(--cal-ot-bg);border-color:var(--cal-ot-border);border-width:1.8px}
.cal-cell.cal-today{outline:2.5px solid var(--cal-today-ring);outline-offset:-1.5px;z-index:1}
.cal-cell.cal-out{opacity:.28;cursor:default;background:transparent!important;border-color:transparent!important}
.cal-cell.cal-out:hover{transform:none;box-shadow:none;border-color:transparent!important}

@media(max-width:380px){
  .cal-cell{height:48px;min-height:48px;padding:3px 2px 2px}
  .cal-num{font-size:12.5px}.cal-hname{font-size:8px}
  .cal-ot-badge{font-size:8.5px;padding:1px 4px;border-radius:5px}
  .cal-grid{gap:3px}
}

/* ==================== 统计卡片 — 对标参考设计 ==================== */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{
  background:var(--surface);border-radius:var(--r-card);padding:14px 13px;
  box-shadow:var(--shadow-sm);border-left:4px solid transparent;
  transition:transform .15s,box-shadow .18s
}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
/* 左边框色 — 对标截图 */
.stat-teal{border-left-color:var(--stat-teal)}
.stat-blue{border-left-color:var(--stat-blue)}
.stat-amber{border-left-color:var(--stat-amber)}
/* 紫色渐变总费用卡（对标截图右下角） */
.stat-gradient{
  background:linear-gradient(135deg,var(--stat-grad-from),var(--stat-grad-to));
  border-left-color:transparent;
}
.stat-gradient .stat-label,.stat-gradient .stat-val,.stat-gradient .stat-sub{color:#fff}
.stat-gradient .stat-sub{opacity:.85}
/* 周期性固定费用卡片 — 添加后才显示，默认隐藏 */
#statRecurringWrap.hidden{display:none}
.stat-label{font-size:12px;color:var(--text-sec);font-weight:500;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:800;color:var(--text);line-height:1.2;letter-spacing:-.3px}
.stat-unit{font-size:12px;font-weight:600;color:var(--text-sec);margin-left:2px}
.stat-sub{font-size:11px;color:var(--text-light);margin-top:4px}

/* 设置内数据管理按钮 */
.data-btns{display:flex;gap:8px}
.data-btns .ghost-btn{flex:1}
.ghost-btn{
  flex:1;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);border-radius:var(--r-btn);background:var(--surface);
  color:var(--text-sec);transition:all .15s
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(91,127,255,.04)}
.ghost-btn:active{transform:scale(.97)}
.update-info{font-size:11.5px;color:var(--text-light);margin-top:7px;line-height:1.5;min-height:0}
.update-info a{color:var(--accent);text-decoration:none;word-break:break-all}
.update-info .up-new{color:var(--success);font-weight:600}
.update-info .up-latest{color:var(--success);font-weight:600}
.update-info .up-tip{display:inline-block;margin-top:2px}
.update-info .up-code{display:inline-block;margin:5px 0;padding:3px 6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-sec);word-break:break-all}
.update-info .up-notes{margin:6px 0;padding:6px 8px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;color:var(--text-sec);font-size:11px;word-break:break-word}
.update-info .up-dl{display:inline-block;margin:6px 0 2px;padding:7px 12px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;text-decoration:none;word-break:break-all}
.update-info .up-err{color:#e5484d;font-weight:600}
.update-info .up-loading{color:var(--text-light)}
.update-info .up-progress{margin:6px 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px}

/* ==================== 弹窗对话框 ==================== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-dialog{
  background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow-lg);width:92%;max-width:390px;
  max-height:90vh;overflow-y:auto;padding:22px 18px 18px;
  transform:translateY(16px) scale(.97);transition:transform .25s ease
}
.modal-overlay.show .modal-dialog{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h3{font-size:17px;font-weight:700;color:var(--text)}
.modal-close{
  width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);
  color:var(--text-sec);cursor:pointer;display:grid;place-items:center;
  font-size:18px;transition:all .15s
}
.modal-close:hover{background:var(--danger);color:#fff}
.f-group{margin-bottom:14px}
.f-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-sec);margin-bottom:6px}
.f-hint{font-weight:400;color:var(--text-light);font-size:11px}
.f-input{
  width:100%;padding:10px 12px;font-size:14.5px;border:1.5px solid var(--border);
  border-radius:var(--r-input);background:var(--bg);color:var(--text);
  transition:border-color .18s,box-shadow .18s;outline:none
}
.f-input::placeholder{color:var(--text-light)}
.f-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,127,255,.10)}
input[type="date"]{color-scheme:light dark}
.item-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.item-row{display:grid;grid-template-columns:1fr 80px 70px 28px;gap:6px;align-items:center}
.item-row input{padding:7px 9px;font-size:13px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.item-row input:focus{border-color:var(--accent)}
.item-row .del{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--danger);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.item-row .del:hover{background:#fef2f2;border-color:#fecaca}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);color:var(--text-sec);cursor:pointer;transition:all .15s;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(91,127,255,.06)}
.add-btn{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:1.5px dashed var(--border);border-radius:var(--r-btn);padding:7px 12px;font-weight:500;transition:all .15s;width:100%}
.add-btn:hover{border-color:var(--accent);background:rgba(91,127,255,.03)}
.save-btn{display:block;width:100%;margin-top:12px;padding:9px 16px;font-size:13.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:var(--r-btn);cursor:pointer;transition:all .15s}
.save-btn:hover{opacity:.88;transform:translateY(-1px)}
.save-btn:active{transform:translateY(0)}
.cycle-select{padding:8px 10px;font-size:13px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;min-width:0}
.submit-btn{
  width:100%;padding:11px 14px;font-size:14.5px;font-weight:700;border:none;
  border-radius:var(--r-btn);cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;
  letter-spacing:.3px;transition:opacity .18s,transform .12s,box-shadow .18s;
  box-shadow:0 3px 10px rgba(91,127,255,.24);margin-top:4px
}
.submit-btn:hover{opacity:.92;box-shadow:0 5px 16px rgba(91,127,255,.32)}
.submit-btn:active{transform:scale(.985)}

/* ==================== 设置面板 ==================== */
.settings-card{padding:0;overflow:hidden}
.settings-summary{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;list-style:none;user-select:none;transition:background .15s}
.settings-summary::-webkit-details-marker{display:none}
.settings-summary:hover{background:rgba(0,0,0,.02)}[data-theme="dark"] .settings-summary:hover{background:rgba(255,255,255,.03)}
.settings-sum-text{font-size:15px;font-weight:650}
.chev{color:var(--text-light);transition:transform .25s}
.settings-card[open] .chev{transform:rotate(180deg)}
.settings-body{padding:0 16px 16px;border-top:1px solid var(--border-light)}

/* ==================== 记录列表 ==================== */
.list-section{}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.list-header h3{font-size:15px;font-weight:700}
.list-count{font-size:11.5px;color:var(--text-light);font-weight:500}
.record-list{display:flex;flex-direction:column;gap:8px}
.record{
  background:var(--surface);border-radius:var(--r-card);padding:12px 14px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border-light);
  transition:transform .15s,box-shadow .18s
}
.record:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.record-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.record-date{font-size:14px;font-weight:650;color:var(--text)}
.record-sub{font-size:17px;font-weight:800;color:var(--accent)}
.record-note{font-size:12.5px;color:var(--text-sec);margin-top:3px;line-height:1.45}
.record-base{font-size:11.5px;color:var(--text-light);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.record-items{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.record-items .ri{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-sec);padding:2px 0}
.record-items .ri span:last-child{color:var(--text);font-weight:550}
.record-actions{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.record-actions button{font-size:12.5px;padding:6px 12px;border-radius:9px;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text-sec);font-weight:500;transition:all .15s}
.record-actions .edit:hover{border-color:var(--accent);color:var(--accent);background:rgba(91,127,255,.06)}
.record-actions .del:hover{border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,.06)}

/* 空态/骨架屏 */
.loading-skel{padding:16px 4px}
.skel{height:13px;background:linear-gradient(90deg,var(--border-light) 25%,var(--border) 50%,var(--border-light) 75%);background-size:200% 100%;animation:skel-shimmer 1.5s infinite;border-radius:6px;margin-bottom:8px}
.skel.short{width:60%}.skel.med{width:80%}
@keyframes skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty-state{text-align:center;padding:36px 18px 30px}
.empty-ico{color:var(--text-light);margin-bottom:10px;opacity:.5}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty-hint{font-size:12.5px;color:var(--text-light)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;
  pointer-events:none;transition:opacity .22s,transform .22s;z-index:300;
  white-space:nowrap;max-width:85vw;overflow:hidden;text-overflow:ellipsis
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 中国法定节假日 */
var HOLIDAYS = {
  '2026': {
    ranges: [
      ['2026-01-01', '2026-01-03'], ['2026-02-15', '2026-02-23'],
      ['2026-04-04', '2026-04-06'], ['2026-05-01', '2026-05-05'],
      ['2026-06-19', '2026-06-21'], ['2026-09-25', '2026-09-27'],

    ],
    names: {
      '2026-01-01': '\u5143\u65E6', '2026-02-15': '\u6625\u8282',
      '2026-04-04': '\u6E05\u660E', '2026-05-01': '\u52B3\u52A8\u8282',
      '2026-06-19': '\u7AEF\u5348', '2026-09-25': '\u4E2D\u79CB',
      '2026-10-01': '\u56FD\u5E86'
    },
    workdays: ['2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10']
  }
};

var state = {
  settings: { hourlyRate: 50, presets: [] },
  records: [],
  editingId: null
};
var calState = { year: 0, month: 0 };

var API_BASE = (function() {

function $(id) { try { return document.getElementById(id); } catch(e) { return null; } }

/* 金额格式化：无币种符号，保留两位小数 */
function money(n) {
  return (Number(n) || 0).toFixed(2);
}

function toast(msg) {
  var t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(toast._t);
  toast._t = setTimeout(function() {
    t.className = 'toast';
    setTimeout(function() { t.className = 'toast hidden'; }, 220);
  }, 1800);
}

function pad2(n) { var s = String(n); return s.length < 2 ? '0' + s : s; }

function toISO(y, m, d) { return String(y) + '-' + pad2(m + 1) + '-' + pad2(d); }

function getDayInfo(dateStr) {
  var d, dow, y, h, i, r, type, name;
  try { d = new Date(dateStr + 'T00:00:00'); } catch(e) { return { type: 'weekday', name: '', dow: 0 }; }
  dow = d.getDay();
  y = String(d.getFullYear());
  h = HOLIDAYS[y];
  type = 'weekday';
  name = '';
  if (h) {
    if (h.workdays) {
      for (i = 0; i < h.workdays.length; i++) {
        if (h.workdays[i] === dateStr) return { type: 'weekday', name: '', dow: dow };
      }
    }
    if (h.ranges) {
      for (i = 0; i < h.ranges.length; i++) {
        r = h.ranges[i];
        if (dateStr >= r[0] && dateStr <= r[1]) { type = 'holiday'; break; }
      }
    }
    if (h.names && h.names[dateStr]) name = h.names[dateStr];
  }
  if (type === 'weekday' && (dow === 0 || dow === 6)) type = 'weekend';
  return { type: type, name: name, dow: dow };
}

function buildDayMap() {
  var map = {}, i, r, d;
  if (!state.records) return map;
  for (i = 0; i < state.records.length; i++) {
    r = state.records[i];
    d = (r && r.date) ? r.date : '';
    if (!d) continue;
    if (!map[d]) map[d] = { hours: 0, count: 0 };
    map[d].hours += Number(r.hours) || 0;
    map[d].count += 1;
  }
  return map;
}

function todayISO() {
  var t = new Date();
  return toISO(t.getFullYear(), t.getMonth(), t.getDate());
}

function escHtml(s) {
  if (s === null || s === undefined) s = '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    daysInPrev = new Date(y, m, 0).getDate();

    dayMap = buildDayMap();

      else if (i >= startOffset + daysInMonth) { dateObj = new Date(y, m + 1, i - startOffset - daysInMonth + 1); out = true; }

      info = getDayInfo(dateStr);

      if (out) cls += ' cal-out';

/* ============ 数据导入 / 导出 / 更新 ============ */
function bindDataButtons() {
  var exp = $('exportBtn');
  if (exp) exp.onclick = function() {
    var url = API_BASE + '/api/export';
    try {
      var a = document.createElement('a');
      a.href = url; a.download = 'overtime-backup.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('\u5F00\u59CB\u4E0B\u8F7D\u5907\u4EFD\u2026');
    } catch(e) {
      window.open(url, '_blank');
    }
  };
  var imp = $('importBtn'), file = $('importFile');
  if (imp && file) imp.onclick = function() { try { file.click(); } catch(e) { toast('\u5BFC\u5165\u5931\u8D25:' + e.message); } };
  if (file) file.onchange = function() {
    if (!file.files || !file.files.length) return;
    var f = file.files[0];
    var reader = new FileReader();
    reader.onload = function(ev) {
      var text = ev.target ? ev.target.result : '';
      doImport(text);
    };
    reader.onerror = function() { toast('\u8BFB\u53D6\u6587\u4EF6\u5931\u8D25'); };
    reader.readAsText(f);
    file.value = '';
  };
  var cu = $('checkUpdateBtn');
  if (cu) cu.onclick = checkForUpdate;
  checkForUpdate(); // 页面加载自动检查更新（对齐 fnos-hermes-agent 的自动拉取）
}

function doImport(text) {
  var data;
  try { data = JSON.parse(text); } catch(e) { toast('\u6587\u4EF6\u683C\u5F0F\u9519\u8BEF\uff0c\u9700\u4E3A JSON'); return; }
  if (!confirm('\u5BFC\u5165\u5C06\u8986\u76D6\u5F53\u524D\u6240\u6709\u6570\u636E\uff0c\u662F\u5426\u7EE7\u7EED\uff1F\n\u70B9\u51FB\u201C\u53D6\u6D88\u201D\u53EF\u6539\u4E3A\u5408\u5E76\u6A21\u5F0F\u3002')) {
    // 用户取消覆盖 → 合并模式
    api('POST','/api/import',data,'merge').then(function(res){ toast('\u5DF2\u5408\u5E76\u5BFC\u5165 ' + (res&&res.records?res.records:0) + ' \u6761'); return refresh(); }).catch(function(err){ toast('\u5BFC\u5165\u5931\u8D25:'+(err.message||err)); });
    return;
  }
  api('POST','/api/import',data,'replace').then(function(res){ toast('\u5DF2\u5BFC\u5165 ' + (res&&res.records?res.records:0) + ' \u6761'); return refresh(); }).catch(function(err){ toast('\u5BFC\u5165\u5931\u8D25:'+(err.message||err)); });
}

/* 覆盖 api() 以支持自定义请求头（导入模式） */
function apiRaw(method, url, body, mode) {
  var fullUrl = API_BASE + url;
  var opt = { method: method };
  opt.headers = { 'Content-Type': 'application/json' };
  if (mode) opt.headers['X-Import-Mode'] = mode;
  opt.body = JSON.stringify(body);
  return fetch(fullUrl, opt).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}
function api(method, url, body, mode) {
  if (mode) return apiRaw(method, url, body, mode);
  return apiRaw(method, url, body, null);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 检查更新：调用后端 /api/check-update（后端代理 GitHub，绕开 WebView CORS）
// 对齐 fnos-hermes-agent 的「更新页自动拉取版本信息、对比后一键升级」体验
function checkForUpdate() {
  var info = $('updateInfo');
  if (!info) return;
  info.innerHTML = '<span class="up-loading">正在检查更新…</span>';
  api('GET', '/api/check-update').then(function(r) {
    if (!r || !r.ok) {
      info.innerHTML = '<span class="up-err">检查失败：' + escapeHtml((r && r.error) || '未知错误') + '</span>'
        + '<br><span class="up-tip">可手动前往：<a href="' + UPDATE_SOURCE + '" target="_blank" rel="noopener">发布页</a></span>';
      return;
    }
    if (!r.hasUpdate) {
      info.innerHTML = '<span class="up-latest">✓ 已是最新版本 v' + escapeHtml(r.current) + '</span>'
        + '<div class="up-tip">如需飞牛内一键更新，请在 <b>设置 → 应用中心 → 社区源</b> 添加源：<br><code class="up-code">' + UPDATE_SOURCE + '</code></div>';
      return;
    }
    // 发现新版本 — 显示更新内容 + 立即更新按钮（对齐 hermes-agent 一键升级）
    var html = '<span class="up-new">发现新版本 v' + escapeHtml(r.latest) + (r.publishedAt ? '（' + escapeHtml(r.publishedAt.slice(0, 10)) + '）' : '') + '</span>';
    if (r.notes) html += '<div class="up-notes">' + escapeHtml(r.notes).replace(/\n/g, '<br>') + '</div>';
    html += '<button type="button" id="doUpdateBtn" class="up-dl" onclick="doAppUpdate()">⬇ 立即更新</button>';
    html += '<div id="updateProgress" class="up-progress"></div>';
    html += '<div class="up-tip">点击后将自动下载并尝试覆盖安装（对齐 hermes-agent 直接更新）</div>';
    info.innerHTML = html;
  }).catch(function(err) {
    info.innerHTML = '<span class="up-err">检查失败：' + escapeHtml(err.message || String(err)) + '</span>';
  });
}

// 执行一键更新：调用后端 /api/update 下载 fpk 并触发安装
function doAppUpdate() {
  var btn = $('doUpdateBtn');
  var prog = $('updateProgress');
  if (btn) { btn.disabled = true; btn.textContent = '正在下载…'; }
  if (prog) prog.innerHTML = '<span class="up-loading">正在从 GitHub 下载新版本，请稍候…</span>';

  api('POST', '/api/update').then(function(r) {
    if (!r || !r.ok) {
      if (prog) prog.innerHTML = '<span class="up-err">更新失败：' + escapeHtml((r && r.error) || '未知错误') + '</span>';
      if (btn) { btn.disabled = false; btn.textContent = '⬇ 重试'; }
      return;
    }
    // 下载成功
    var msg = '✅ v' + escapeHtml(r.version) + ' 已下载（' + Math.round((r.fpkSize||0)/1024) + ' KB）';
    if (r.installAttempt && r.installAttempt.ok) {
      msg += '<br>✅ 已触发系统安装，应用将自动重启';
      if (prog) prog.innerHTML = '<span class="up-latest">' + msg + '</span>';
      if (btn) { btn.style.display = 'none'; }
    } else {
      // 自动安装未成功（fnOS 内部接口可能不可用），提示手动操作
      msg += '<br><span class="up-tip">请前往 <b>飞牛应用中心 → 手动安装</b>，选择已下载的文件完成覆盖。<br>文件位置：' + escapeHtml(r.fpkPath || '') + '</span>';
      if (prog) prog.innerHTML = '<span class="up-latest">' + msg + '</span>';
      if (btn) { btn.disabled = false; btn.textContent = '✓ 下载完成，请手动安装'; }
    }
  }).catch(function(err) {
    if (prog) prog.innerHTML = '<span class="up-err">更新异常：' + escapeHtml(err.message || String(err)) + '</span>';
    if (btn) { btn.disabled = false; btn.textContent = '⬇ 重试'; }
  });
}


function refresh() {
  return api('GET','/api/state').then(function(data) {
    if (data) { if (data.settings) state.settings = data.settings; if (data.records) state.records = data.records; }
    return api('GET','/api/summary');
  }).then(function(sum) {
    if (sum) state.summary = sum;
    syncSettingsInputs(); renderRecurring(); renderSummary(); renderRecords(); renderCalendar();
  }).catch(function(err) {
    var rl = $('recordList');
    if (rl) rl.innerHTML = '<div style="padding:24px;text-align:center;color:#999;font-size:14px;">\u52A0\u8F7D\u5931\u8D25:'+escHtml((err&&err.message)?err.message:String(err))+'</div>';
  });
}

function init() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark', tt = $('themeToggle'), moon, sun;
  if (tt) { moon = tt.querySelector('.ico-moon'); sun = tt.querySelector('.ico-sun'); if (moon) moon.style.display = isDark?'none':''; if (sun) sun.style.display = isDark?'':'none'; }
  bindEvents(); resetForm(); refresh();
}

if (document.addEventListener) document.addEventListener('DOMContentLoaded', init);
else if (document.attachEvent) document.attachEvent('onreadystatechange', function() { if (document.readyState === 'complete') init(); });
else setTimeout(init, 0);
</script>
</body>
</html>
